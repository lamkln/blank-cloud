services:
  blank-cloud:
    image: blank-cloud
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ${BLANK_CLOUD_PROJECT:-./project}:/workspace
      - ${BLANK_CLOUD_DATA:-./data}:/app/data
      # Optional — one-click updates from the Web UI (see README):
      # - ${BLANK_CLOUD_INSTALL:-.}:/install
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PORT: "8787"
      WORKSPACE: /workspace
      BLANK_CLOUD_DATA: /app/data
      # Optional bootstrap (overridden after you save in Web UI Settings)
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NIM_API_KEY: ${NIM_API_KEY:-}
      NIM_BASE_URL: ${NIM_BASE_URL:-}
      CUSTOM_OPENAI_BASE_URL: ${CUSTOM_OPENAI_BASE_URL:-}
      CUSTOM_OPENAI_API_KEY: ${CUSTOM_OPENAI_API_KEY:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      BLANK_CLOUD_PUBLIC_URL: ${BLANK_CLOUD_PUBLIC_URL:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Optional Web UI auto-update (requires install + docker.sock mounts above):
      BLANK_CLOUD_INSTALL_DIR: ${BLANK_CLOUD_INSTALL_DIR:-}
      BLANK_CLOUD_UPDATE_APPLY: ${BLANK_CLOUD_UPDATE_APPLY:-0}
      BLANK_CLOUD_AUTO_APPLY: ${BLANK_CLOUD_AUTO_APPLY:-0}
      BLANK_CLOUD_AUTO_CHECK: ${BLANK_CLOUD_AUTO_CHECK:-1}
      BLANK_CLOUD_REF: ${BLANK_CLOUD_REF:-main}
