services:
  blank-cloud:
    image: blank-cloud
    build: .
    ports:
      - "8787:8787"
    volumes:
      - ${BLANK_CLOUD_PROJECT:-./project}:/workspace
      - ${BLANK_CLOUD_DATA:-./data}:/app/data
    environment:
      PORT: "8787"
      WORKSPACE: /workspace
      BLANK_CLOUD_DATA: /app/data
      # Optional bootstrap (overridden after you save in Web UI Settings)
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GENERATIVE_AI_API_KEY: ${GOOGLE_GENERATIVE_AI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CUSTOM_OPENAI_BASE_URL: ${CUSTOM_OPENAI_BASE_URL:-}
      CUSTOM_OPENAI_API_KEY: ${CUSTOM_OPENAI_API_KEY:-}
