<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>blank-cloud</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div class="layout">
      <header class="header">
        <div class="brand">
          <h1>blank-cloud</h1>
          <p class="muted" id="workspace">workspace …</p>
        </div>
        <div class="header-meta">
          <span class="pill" id="health-pill">checking</span>
        </div>
      </header>

      <aside class="sidebar">
        <section class="panel">
          <h2>Provider</h2>
          <label class="field">
            <span>Backend</span>
            <select id="provider"></select>
          </label>
          <label class="field">
            <span>Model</span>
            <input id="model" type="text" autocomplete="off" />
          </label>
          <label class="field" id="custom-url-wrap" hidden>
            <span>Custom base URL</span>
            <input id="custom-base-url" type="url" autocomplete="off" />
          </label>
          <button type="button" class="btn secondary" id="save-settings">Save settings</button>
          <p class="hint">API keys stay in container env only.</p>
        </section>
      </aside>

      <main class="main">
        <section class="panel">
          <h2>Task</h2>
          <label class="field">
            <span>Prompt</span>
            <textarea
              id="prompt"
              rows="4"
              placeholder="Describe what to change in the mounted project…"
            ></textarea>
          </label>
          <div class="row">
            <button type="button" class="btn primary" id="run-task">Run agent</button>
            <span class="status-badge" id="task-status">idle</span>
          </div>
        </section>

        <section class="panel proposal" id="proposal-panel" hidden>
          <div class="row spread">
            <h2>Proposed changes</h2>
            <div class="row">
              <button type="button" class="btn primary" id="approve">Approve</button>
              <button type="button" class="btn danger" id="undo">Undo last apply</button>
            </div>
          </div>
          <p id="proposal-summary"></p>
          <div id="proposal-files"></div>
          <div id="proposal-commands" class="commands"></div>
        </section>

        <section class="panel log-panel">
          <h2>Log</h2>
          <pre id="log" aria-live="polite"></pre>
        </section>
      </main>
    </div>
    <script src="/ui/app.js" type="module"></script>
  </body>
</html>
