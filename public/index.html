<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>blank-cloud</title>
    <link rel="stylesheet" href="/ui/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="runs-panel">
        <div class="runs-header">
          <div class="logo">blank-cloud</div>
          <button type="button" class="icon-btn" id="new-run" title="New agent run">+</button>
        </div>
        <p class="runs-sub" id="workspace">workspace …</p>
        <ul class="run-list" id="run-list"></ul>
        <details class="settings-drawer">
          <summary>Model &amp; provider</summary>
          <label class="field">
            <span>Provider</span>
            <select id="provider"></select>
          </label>
          <label class="field">
            <span>Model</span>
            <input id="model" type="text" autocomplete="off" />
          </label>
          <label class="field" id="custom-url-wrap" hidden>
            <span>Custom OpenAI base URL</span>
            <input id="custom-base-url" type="url" autocomplete="off" />
          </label>
          <button type="button" class="btn ghost" id="save-settings">Save</button>
          <p class="hint">Keys live in container env only.</p>
        </details>
      </aside>

      <section class="chat-panel">
        <header class="chat-header">
          <div>
            <h1 id="run-title">New agent run</h1>
            <p class="run-meta" id="run-meta">Describe a coding task below</p>
          </div>
          <div class="status-chip idle" id="status-chip">idle</div>
        </header>
        <div class="chat-thread" id="chat-thread"></div>
        <footer class="composer">
          <textarea
            id="composer-input"
            rows="2"
            placeholder="Ask the agent to implement, fix, or refactor code in your mounted project…"
          ></textarea>
          <div class="composer-actions">
            <span class="hint">Enter to send · Shift+Enter for newline</span>
            <button type="button" class="btn primary" id="send-btn">Send</button>
          </div>
        </footer>
      </section>

      <aside class="changes-panel" id="changes-panel" hidden>
        <header class="changes-header">
          <h2>Changes</h2>
          <p id="change-summary"></p>
        </header>
        <div class="change-actions">
          <button type="button" class="btn primary" id="approve">Approve</button>
          <button type="button" class="btn ghost" id="reject">Reject</button>
          <button type="button" class="btn ghost" id="undo">Undo apply</button>
        </div>
        <div id="change-files"></div>
        <div id="change-commands" class="commands"></div>
      </aside>
    </div>
    <script src="/ui/app.js" type="module"></script>
  </body>
</html>
